yaml
name: BMS Ticket Checker

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"

  # Allows you to manually run it from GitHub Actions
  workflow_dispatch:

jobs:
  check-bms:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Restore BMS state
        uses: actions/download-artifact@v4
        with:
          name: bms-state
          path: .
        continue-on-error: true

      - name: Run BMS checker
        env:
          BMS_URL: ${{ secrets.BMS_URL }}
          BMS_DATES: ${{ secrets.BMS_DATES }}
          BMS_THEATRE: ${{ secrets.BMS_THEATRE }}
          BMS_TIME: ${{ secrets.BMS_TIME }}

          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          python main.py

      - name: Save BMS state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bms-state
          path: bms_state.json
          retention-days: 7
          overwrite: true
