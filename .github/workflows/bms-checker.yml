yaml
name: BMS Ticket Checker

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check-bms:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: Restore previous BMS state
        uses: actions/cache/restore@v4
        with:
          path: bms_state.json
          key: bms-state-${{ github.run_id }}
          restore-keys: |
            bms-state-

      - name: Run BMS checker
        env:
          BMS_URL: ${{ secrets.BMS_URL }}
          BMS_DATES: ${{ secrets.BMS_DATES }}
          BMS_THEATRE: ${{ secrets.BMS_THEATRE }}
          BMS_TIME: ${{ secrets.BMS_TIME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          python main.py

      - name: Save BMS state
        if: always() && hashFiles('bms_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: bms_state.json
          key: bms-state-${{ github.run_id }}
