name: BMS Ticket Checker

on:
  repository_dispatch:
    types: [trigger_bms_check]  # External trigger via cron-job.org or Telegram Bot
  workflow_dispatch:  # Manual trigger button

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run checker
        env:
        
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          BMS_URL: ${{ vars.BMS_URL }}
          BMS_DATES: ${{ vars.BMS_DATES }}
          BMS_THEATRE: ${{ vars.BMS_THEATRE }}
          BMS_TIME: ${{ vars.BMS_TIME }}
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          GROUP_CHAT_ID: ${{ vars.GROUP_CHAT_ID }}
          NOTIFICATION_USERS: ${{ vars.NOTIFICATION_USERS }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          NTFY_URL: ${{ vars.NTFY_URL }}
          NTFY_ERROR_TOPIC: ${{ vars.NTFY_ERROR_TOPIC }}
        run: uv run main.py
      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bms_state.json data/watches.json
          git diff --cached --quiet || (git commit -m "chore: update state and watches [skip ci]" && git pull origin main --rebase && git push)
